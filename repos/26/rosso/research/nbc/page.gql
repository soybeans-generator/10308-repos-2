query page(
  $id: ID
  $name: String!
  $queryName: QueryNames
  $type: PageType!
  $subType: PageSubType
  $nationalBroadcastType: String
  $userId: String!
  $platform: SupportedPlatforms!
  $device: String
  $profile: JSON
  $timeZone: String
  $deepLinkHandle: String
  $app: NBCUBrands!
  $nbcAffiliateName: String
  $telemundoAffiliateName: String
  $language: Languages
  $playlistMachineName: String
  $mpxGuid: String
  $authorized: Boolean
  $minimumTiles: Int
  $endCardMpxGuid: String
  $endCardTagLine: String
  $seasonNumber: Int
  $creditMachineName: String
  $roleMachineName: String
  $originatingTitle: String
  $isDayZero: Boolean
) {
  page(
    id: $id
    name: $name
    type: $type
    subType: $subType
    nationalBroadcastType: $nationalBroadcastType
    userId: $userId
    queryName: $queryName
    platform: $platform
    device: $device
    profile: $profile
    timeZone: $timeZone
    deepLinkHandle: $deepLinkHandle
    app: $app
    nbcAffiliateName: $nbcAffiliateName
    telemundoAffiliateName: $telemundoAffiliateName
    language: $language
    playlistMachineName: $playlistMachineName
    mpxGuid: $mpxGuid
    authorized: $authorized
    minimumTiles: $minimumTiles
    endCardMpxGuid: $endCardMpxGuid
    endCardTagLine: $endCardTagLine
    seasonNumber: $seasonNumber
    creditMachineName: $creditMachineName
    roleMachineName: $roleMachineName
    originatingTitle: $originatingTitle
    isDayZero: $isDayZero
  ) {
    id
    pageType
    name
    metadata {
      __typename
      ... on VideoPageMetaData {
        title
        secondaryTitle
        tertiaryTitle
        playlistTitle
        playlistMachineName
        playlistImage {
          path
          width
          height
          altText
        }
        playlistCreated
        playlistDescription
        description
        shortDescription
        gradientStart
        gradientEnd
        lightPrimaryColor
        darkPrimaryColor
        brandLightPrimaryColor
        brandDarkPrimaryColor
        seasonNumber
        episodeNumber
        airDate
        rating
        copyright
        locked
        programmingType
        genre
        amazonGenre
        duration
        permalink
        image
        labelBadge
        mpxGuid
        authEnds
        externalAdvertiserId
        mpxEntitlementWindows {
          availStartDateTime
          availEndDateTime
          entitlement
          device
        }
        tveEntitlementWindows {
          availStartDateTime
          availEndDateTime
          entitlement
          device
        }
        cast {
          characterFirstName
          characterLastName
          talentFirstName
          talentMiddleName
          talentLastName
        }
        v4ID
        seriesShortTitle
        seriesShortDescription
        multiPlatformLargeImage
        multiPlatformSmallImage
        urlAlias
        seriesType
        dayPart
        sunrise
        sunset
        ratingAdvisories
        width
        height
        selectedCountries
        keywords
        watchId
        numberOfEpisodes
        numberOfSeasons
        channelId
        resourceId
        mpxAccountId
        mpxAdPolicy
        brandDisplayTitle
        brandMachineName
        colorBrandLogo
        whiteBrandLogo
        cuePoint
        startRecapTiming
        endRecapTiming
        startTeaserTiming
        endTeaserTiming
        startIntroTiming
        endIntroTiming
        allowSkipButtons
        skipButtonsDuration
        allowMobileWebPlayback
        canonicalUrl
        ariaLabel
        tmsId
        movieShortTitle
        headerTitle
        tuneIn
      }
    }
    analytics {
      ... on VideoPageAnalyticsAttributes {
        series
        brand {
          title
        }
        title
        movie
        programmingType
        episodeNumber
        seasonNumber
        mpxGuid
        locked
        duration
        playlistTitle
        playlistPosition
        tmsId
        isLongFormContent
        durationInMilliseconds
        airDate
        dayPart
        webBrandDomain
        permalink
        genre
        secondaryGenre
        titleTmsId
        clipCategory
        adobeVideoPlatform
        adobeContentType
        adobeBrand
        convivaAssetName
        videoBroadcast
        isOlympics
        listOfGenres
        rating
        ratingAdvisories
        nielsenProgen
        nielsenBrand
        nielsenSfCode
        nielsenClientId
        nielsenChannel
        ottPlatform
        sport
        event
        league
        language
        entitlement
      }
      ... on StreamPageAnalyticsAttributes {
        pageType
        programmingType
        brand {
          title
        }
        genre
        secondaryGenre
        sport
        league
        rating
        ratingAdvisories
      }
    }
    data {
      sections {
        ... on CoreSDKPlayer {
          component
          meta
          treatments
          logicName
          deepLinkHandle
          CoreSDKPlayerData: data {
            instanceID
            player {
              v4ID
              contentType
              title
              titleId
              permalink
              description
              secondaryTitle
              secondaryGenre
              programmingType
              pid
              image
              airDate
              brandDisplayTitle
              brandMachineName
              colorBrandLogo
              whiteBrandLogo
              resourceId
              regionEntitlementId
              channelId
              sport
              league
              offerType
              tuneIn
              gradientStart
              gradientEnd
              tertiaryTitle
              entitlement
              locked
              endTime
              startTime
              backgroundImage
              headerTitle
              headerTitleLogo
              duration
              rating
              ratingAdvisories
              nielsenSfCode
              ariaLabel
              mpxGuid
              seasonNumber
              episodeNumber
              genre
              amazonGenre
              copyright
              dayPart
              shortDescription
              sunset
              keywords
              seriesShortTitle
              seriesUrlAlias
              lightPrimaryColor
              mpxAccountId
              mpxAdPolicy
              allowMobileWebPlayback
              startRecapTiming
              endRecapTiming
              startTeaserTiming
              endTeaserTiming
              startIntroTiming
              endIntroTiming
              cuePoint
              externalAdvertiserId
              tmsId
              movieShortTitle
              allowSkipButtons
              skipButtonsDuration
              goToButtonText
              goToButtonDestination
              stationId
              callSign
              streamAccessName
              notification {
                ... on Notification {
                  component
                  meta
                  treatments
                  data {
                    instanceID
                    v4ID
                    machineName
                    headline
                    headlineColor
                    message
                    messageColor
                    logo
                    logoAltText
                    portraitImage
                    landscapeImage
                    cta {
                      ... on CTALink {
                        component
                        meta
                        treatments
                        data {
                          instanceID
                          color
                          gradientStart
                          gradientEnd
                          text
                          destinationType
                          destination
                          endCardMpxGuid
                          endCardTagLine
                          playlistMachineName
                          playlistCount
                          urlAlias
                          isLive
                          isPlaylist
                          title
                          secondaryTitle
                          secondaryTitleTag
                          isSportsVideoSlide
                          image {
                            path
                            width
                            height
                            altText
                          }
                          pid
                          contentType
                          ariaLabel
                        }
                        analytics {
                          ctaTitle
                          destinationType
                          destination
                          brand {
                            title
                          }
                          series
                          movie
                          isMovie
                          videoTitle
                          locked
                          programmingType
                          seasonNumber
                          episodeNumber
                          mpxGuid
                          duration
                          isPlaylist
                          playlistMachineName
                          playlistTitle
                          isLive
                          sponsorName
                          isSponsoredTitle
                          isSportVideo
                          language
                          league
                          event
                          sport
                          pid
                        }
                      }
                    }
                    dismissText
                  }
                  analytics {
                    entityTitle
                    dismissText
                    placement
                  }
                }
              }
              brandV4ID
              broadcastRegion
              contentGatingType
              availableForCredits
            }
            endCard {
              ... on LazyEndCard {
                component
                meta
                treatments
                targetComponent
                lazyData {
                  instanceID
                  queryName
                  queryVariables
                  entryField
                  path
                }
              }
            }
          }
          analytics {
            offerType
            title
            status
            permalink
            pid
            airDate
            programmingType
            resourceId
            regionEntitlementId
            genre
            secondaryGenre
            listOfGenres
            sport
            league
            isOlympics
            videoBroadcast
            isFullEpisode
            durationInMilliseconds
            programTitle
            nielsenProgen
            nielsenChannel
            nielsenSfCode
            videoTitle
            clipCategory
            webBrandDomain
            episodeNumber
            seasonNumber
            adobeVideoPlatform
            adobeVideoResearchTitle
            adobeContentType
            ottPlatform
            callSign
            dayPart
            entitlement
            locked
            rating
            ratingAdvisories
            brand {
              title
            }
            duration
            tmsId
            isLongFormContent
            mpxGuid
            series
            movie
            titleTmsId
            convivaAssetName
            nielsenBrand
            nielsenClientId
            event
            language
            adobeBrand
            playerUrl
            comscoreCallSign
            videoContentType
          }
        }
        ... on LazyOnAirNowShelf {
          component
          meta
          treatments
          logicName
          deepLinkHandle
          targetComponent
          lazyData {
            instanceID
            queryName
            queryVariables
            entryField
            path
          }
        }
        ... on OnAirNowShelf {
          component
          meta
          treatments
          logicName
          deepLinkHandle
          data {
            ... on OnAirNowList {
              instanceID
              machineName
              listTitle
              ariaLabel
              lastModified
              items {
                ... on OnAirNowTile {
                  component
                  meta
                  treatments
                  onAirNowTileData: data {
                    instanceID
                    v4ID
                    image
                    switchToNationalStream
                    title
                    secondaryTitle
                    startTime
                    endTime
                    brandV4ID
                    machineName
                    whiteBrandLogo
                    brandDisplayTitle
                    brandLightPrimary
                    brandDarkPrimary
                    isNew
                    audioDescription
                    ratingWithAdvisories
                    badge
                    resourceId
                    channelId
                    mpxGuid
                    nextEpisodeMpxGuid
                    relativePath
                    nextEpisodeRelativePath
                    watchTagline
                    ariaLabel
                    streamAccessName
                    stationId
                    callSign
                    contentType
                    notification {
                      ... on Notification {
                        component
                        meta
                        treatments
                        data {
                          instanceID
                          v4ID
                          machineName
                          headline
                          headlineColor
                          message
                          messageColor
                          logo
                          logoAltText
                          portraitImage
                          landscapeImage
                          cta {
                            ... on CTALink {
                              component
                              meta
                              treatments
                              data {
                                instanceID
                                color
                                gradientStart
                                gradientEnd
                                text
                                destinationType
                                destination
                                endCardMpxGuid
                                endCardTagLine
                                playlistMachineName
                                playlistCount
                                urlAlias
                                isLive
                                isPlaylist
                                title
                                secondaryTitle
                                secondaryTitleTag
                                isSportsVideoSlide
                                image {
                                  path
                                  width
                                  height
                                  altText
                                }
                                pid
                                contentType
                                ariaLabel
                              }
                              analytics {
                                ctaTitle
                                destinationType
                                destination
                                brand {
                                  title
                                }
                                series
                                movie
                                isMovie
                                videoTitle
                                locked
                                programmingType
                                seasonNumber
                                episodeNumber
                                mpxGuid
                                duration
                                isPlaylist
                                playlistMachineName
                                playlistTitle
                                isLive
                                sponsorName
                                isSponsoredTitle
                                isSportVideo
                                language
                                league
                                event
                                sport
                                pid
                              }
                            }
                          }
                          dismissText
                        }
                        analytics {
                          entityTitle
                          dismissText
                          placement
                        }
                      }
                    }
                  }
                  analytics {
                    isLive
                    entitlement
                    episodeNumber
                    seasonNumber
                    programTitle
                    episodeTitle
                    tmsId
                    adobeVideoResearchTitle
                    league
                    isOlympics
                    sport
                    nielsenSfCode
                    nielsenChannel
                    nielsenClientId
                    videoBroadcast
                    brand {
                      title
                    }
                  }
                }
              }
            }
          }
          analytics {
            itemsList
            machineName
            listTitle
          }
        }
        # ... on LinksSelectableGroup   -> Part 2 (contains 8 of the 10 TileList copies)
        # ... on Shelf                  -> Part 2 (TileList copy #1)
        # ... on Stack                  -> Part 2 (TileList copy #2)
        ... on VideoDetailsExpired {
          component
          meta
          treatments
          logicName
          deepLinkHandle
          data {
            instanceID
            videoMeta {
              title
              secondaryTitle
              description
              image
            }
          }
        }
        ... on StreamNotFound {
          component
          meta
          treatments
          logicName
          deepLinkHandle
          data {
            instanceID
            backgroundImage
          }
        }
      }
      menu {
        ... on NavigationMenu {
          component
          meta
          treatments
          logicName
          deepLinkHandle
          data {
            instanceID
            titleMenu: title
            items {
              ... on NavigationItem {
                data {
                  instanceID
                  title
                  defaultLogo
                  ariaLabel
                  destination
                  isLive
                }
                analytics {
                  analyticsType
                  itemClickedName
                }
              }
            }
          }
          analytics {
            analyticsType
          }
        }
      }
    }
  }
}
