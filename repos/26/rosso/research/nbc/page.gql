query page(
  $app: NBCUBrands!
  $name: String!
  $platform: SupportedPlatforms!
  $type: PageType!
  $userId: String!
  $mpxGuid: String
) {
  page(
    app: $app
    name: $name
    platform: $platform
    type: $type
    userId: $userId
    mpxGuid: $mpxGuid
  ) {
    metadata {
      ... on VideoPageMetaData {
        mpxAccountId
        mpxAdPolicy
        mpxGuid
        multiPlatformLargeImage
        multiPlatformSmallImage
        numberOfEpisodes
        numberOfSeasons
        permalink
        playlistCreated
        playlistDescription
        playlistTitle
        programmingType
      }
    }
  }
}
